name: Feature request
description: Something vgraph should do, and doesn't.
labels: [feature request]
body:
  - type: textarea
    id: what
    attributes:
      label: What it's for
      description: What you are trying to build, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look in a model, a query or the GraphQL schema. A sketch is fine.
    validations:
      required: false

  - type: input
    id: ent
    attributes:
      label: Ent or entgql
      description: The Ent or entgql feature it matches, if any, with a link to its docs.
      placeholder: https://entgo.io/docs/...
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Workarounds you use now, alternatives you considered, related issues.
    validations:
      required: false
