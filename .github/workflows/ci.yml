name: CI

# Only on main: pushes, which include merges into it.
on:
  push:
    branches: [main]

env:
  # The V commit vgraph is built against: V master, until a 0.5.x release
  # includes `v.migrations` (PLAN.md, Q13). Bump it on purpose.
  V_COMMIT: 53dd72c843f46d614acbf13b7f737be6890c6578

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vgraph
          persist-credentials: false
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install --quiet -y libsqlite3-dev
      - name: Build V
        run: |
          git clone --filter=blob:none https://github.com/vlang/v vlang
          git -C vlang checkout "$V_COMMIT"
          make -C vlang -j4
          sudo ./vlang/v symlink
      - name: Install vgraph as five07.vgraph, for the examples
        run: |
          mkdir -p ~/.vmodules/five07
          ln -s "$GITHUB_WORKSPACE/vgraph" ~/.vmodules/five07/vgraph
      - name: Check formatting
        run: v fmt -verify vgraph
      - name: Check doc comments
        run: v vet vgraph/edge.v vgraph/schema.v vgraph/client.v vgraph/migrate.v vgraph/field.v vgraph/driver.v vgraph/mutation.v vgraph/write.v vgraph/hooks.v vgraph/trace.v vgraph/load vgraph/gen vgraph/cmd/vgraph vgraph/graphql vgraph/sqlite vgraph/pg
      - name: Check that the examples' clients are generated from their current models
        run: |
          v run vgraph/cmd/vgraph gen vgraph/examples/service
          v run vgraph/cmd/vgraph gen vgraph/examples/relations
          git -C vgraph diff --exit-code -- examples/service/graph examples/relations/graph
          test -z "$(git -C vgraph status --porcelain -- examples/service/graph examples/relations/graph)"
      - name: Test
        run: v test vgraph

  # The schemas vgraph gen writes must read, and print, the same in graphql-js,
  # which Apollo's tools build on (PLAN.md, Q30).
  graphql-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: vgraph
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install graphql-js
        run: npm install --prefix "$RUNNER_TEMP/graphql-js" --no-save --no-audit --no-fund graphql@16.11.0
      - name: Check the generated schemas with graphql-js
        run: |
          NODE_PATH="$RUNNER_TEMP/graphql-js/node_modules" node vgraph/graphql/testdata/check_schema.js \
            vgraph/examples/service/graph/schema.graphql vgraph/examples/relations/graph/schema.graphql

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: 12345678
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=24
    steps:
      - uses: actions/checkout@v7
        with:
          path: vgraph
          persist-credentials: false
      - name: Install PostgreSQL and SQLite headers
        run: sudo apt-get update && sudo apt-get install --quiet -y libpq-dev libsqlite3-dev
      - name: Build V
        run: |
          git clone --filter=blob:none https://github.com/vlang/v vlang
          git -C vlang checkout "$V_COMMIT"
          make -C vlang -j4
          sudo ./vlang/v symlink
      - name: Install vgraph as five07.vgraph, for the examples
        run: |
          mkdir -p ~/.vmodules/five07
          ln -s "$GITHUB_WORKSPACE/vgraph" ~/.vmodules/five07/vgraph
      - name: Test on PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: 12345678
          PGDATABASE: postgres
        run: v -d vgraph_pg test vgraph/pg_test.v vgraph/examples/relations/pg_test.v
